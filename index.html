<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Cornelius Aurelius – Fitness Equilibrium</title>

<meta name="theme-color" content="#000000" />
<meta name="description" content="Cornelius Aurelius – Fitness Equilibrium. Cinematic vertical hero, auto-play reels, tap-to-enable-sound, minimal high-status design." />

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
 background:#000;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
 overflow-x:hidden;
}

/* TOP INSTAGRAM BAR */
.topbar{
 position:fixed;
 top:0;left:0;
 width:100%;
 padding:12px 20px;
 background:rgba(0,0,0,0.55);
 backdrop-filter:blur(10px);
 z-index:9999;
 border-bottom:1px solid #0a0a0a;
}
.topbar a{
 color:#00aaff;
 font-size:1.15rem;
 font-weight:bold;
 text-decoration:none;
}

/* HERO SECTION */
.hero{
 margin-top:60px;
 position:relative;
 height:100vh;
 width:100%;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow:hidden;
}

/* VERTICAL HERO VIDEO */
.hero video{
 height:88vh;
 width:auto;
 object-fit:contain;
 border-radius:20px;
 box-shadow:0 0 55px #00aaff44;
 z-index:3;
 filter:brightness(0.95);
}

/* SPOTLIGHT EFFECT */
.spotlight{
 position:absolute;
 inset:0;
 pointer-events:none;
 background:radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 70%);
 mix-blend-mode:screen;
 opacity:1;
 transition:1.2s ease;
 z-index:1;
}

/* TAP-TO-ENABLE-SOUND LABEL */
.tap-sound{
 position:absolute;
 bottom:22%;
 font-size:1rem;
 opacity:0.9;
 background:rgba(0,0,0,0.55);
 padding:6px 18px;
 border-radius:40px;
 backdrop-filter:blur(6px);
 color:#fff;
 animation:fadeIn 1.5s ease;
}
@keyframes fadeIn{
 from{opacity:0;}
 to{opacity:0.9;}
}

/* MOTTO UNDER HERO */
.motto{
 text-align:center;
 font-size:1.6rem;
 margin-top:26px;
 color:#00aaff;
 letter-spacing:3px;
 font-weight:bold;
}

/* SECTION */
.section{
 padding:50px 20px 80px;
 max-width:1600px;
 margin:auto;
}

.section h2{
 font-size:2rem;
 color:#00aaff;
 margin-bottom:20px;
 text-align:center;
 letter-spacing:1px;
}

/* VIDEO GRID */
.video-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:22px;
 margin-top:25px;
}

.video-grid video{
 width:100%;
 border-radius:12px;
 background:#000;
 opacity:0;
 transform:translateY(40px);
 transition:0.6s ease;
 box-shadow:0 2px 12px rgba(0,170,255,0.15);
}

video.reveal{
 opacity:1;
 transform:translateY(0);
}

/* FULLSCREEN REEL */
.fullscreen{
 position:fixed;
 inset:0;
 background:#000;
 display:flex;
 justify-content:center;
 align-items:center;
 z-index:999999;
}

.fullscreen video{
 width:auto;
 height:100vh;
 object-fit:contain;
}

.close-fs{
 position:absolute;
 top:20px;right:20px;
 font-size:3rem;
 font-weight:bold;
 color:#fff;
}

/* FOOTER */
footer{
 text-align:center;
 padding:50px 0;
 opacity:0.5;
 font-size:0.9rem;
}
</style>
</head>

<body>

<!-- INSTAGRAM -->
<div class="topbar">
 <a target="_blank" href="https://www.instagram.com/cornelius_aurelius_/">@cornelius_aurelius_</a>
</div>

<!-- HERO -->
<section class="hero" id="hero">
 <video id="heroVideo" autoplay muted playsinline>
   <source src="29.mp4" type="video/mp4" />
 </video>

 <div class="spotlight" id="spotlight"></div>

 <div class="tap-sound" id="tapSound">Tap to enable sound</div>
</section>

<!-- MOTTO -->
<div class="motto">KEEP • MOVING • FORWARD</div>

<!-- VIDEOS -->
<section id="videos" class="section">
 <h2>Training Videos</h2>
 <div class="video-grid" id="videoGrid"></div>
</section>

<footer>© 2025 Cornelius Aurelius – The Omniscientrix</footer>

<script>
/* ============================================================
   AUTO-DETECT VIDEOS (1.mp4 → 200.mp4)
   ============================================================ */
(async function autoDetectVideos() {
  const grid = document.getElementById("videoGrid");
  for (let i = 1; i <= 200; i++) {
    const file = i + ".mp4";
    const exists = await fetch(file, { method: "HEAD" })
      .then(r => r.ok)
      .catch(() => false);

    if (exists) {
      const v = document.createElement("video");
      v.src = file;
      v.preload = "none";
      v.muted = true;
      v.playsInline = true;
      v.controls = false;
      grid.appendChild(v);
    }
  }

  startReveal();
  setupFullscreen();
})();

/* ============================================================
   REVEAL + AUTO-PLAY LIKE INSTAGRAM
   ============================================================ */
function startReveal() {
  const vids = document.querySelectorAll(".video-grid video");
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const v = entry.target;
      if (entry.isIntersecting) {
        v.classList.add("reveal");
        v.play().catch(()=>{});
        document.querySelectorAll(".video-grid video").forEach(o=>{
          if(o!==v) o.pause();
        });
      } else {
        v.pause();
      }
    });
  }, { threshold:0.5 });
  vids.forEach(v=>obs.observe(v));
}

/* ============================================================
   FULLSCREEN MODE + SWIPE
   ============================================================ */
function setupFullscreen() {
  const vids = [...document.querySelectorAll(".video-grid video")];
  let index = 0;
  let fs = null;

  function open(i) {
    index = i;
    fs = document.createElement("div");
    fs.className = "fullscreen";
    const btn = document.createElement("div");
    btn.className = "close-fs";
    btn.innerText="×";
    btn.onclick = close;
    const nv = vids[i].cloneNode(true);
    nv.autoplay = true;

    fs.appendChild(btn);
    fs.appendChild(nv);
    document.body.appendChild(fs);

    /* Swipe Navigation */
    let startY=0,endY=0;
    fs.addEventListener("touchstart", e=>startY=e.touches[0].clientY);
    fs.addEventListener("touchmove", e=>endY=e.touches[0].clientY);
    fs.addEventListener("touchend", ()=>{
      let d=endY-startY;
      if(Math.abs(d)>40){
        if(d>0) close();
        else next();
      }
    });
  }

  function close(){
    if(fs) fs.remove();
  }
  function next(){
    index=(index+1)%vids.length;
    close();
    open(index);
  }

  vids.forEach((v,i)=> v.addEventListener("click",()=>open(i)));
}

/* ============================================================
   HERO SOUND UNLOCK + SPOTLIGHT CONTROL
   ============================================================ */
const hero = document.getElementById("hero");
const heroVideo = document.getElementById("heroVideo");
const spotlight = document.getElementById("spotlight");
const tapSound = document.getElementById("tapSound");

let soundEnabled = false;

hero.addEventListener("click", ()=> {
  if(!soundEnabled){
    heroVideo.muted = false;
    heroVideo.play().catch(()=>{});
    tapSound.style.display = "none";
    soundEnabled = true;

    spotlight.style.opacity = "1";
    setTimeout(()=> spotlight.style.opacity = "0", 1500);
  }
});

/* Spotlight fades when scrolling */
window.addEventListener("scroll",()=>{
  const top = window.scrollY;
  if(top>50){
    spotlight.style.opacity="0";
  }
});
</script>

</body>
</html>
<script>
/* ============================================================
   1. HERO VIDEO — TAP TO ENABLE SOUND + SPOTLIGHT
   ============================================================ */

const hero = document.getElementById("hero");
const heroVideo = document.getElementById("heroVideo");
const tapSound = document.getElementById("tapSound");
const spotlight = document.getElementById("spotlight");
const volIcon = document.getElementById("volIcon");

let soundEnabled = false;

// Hero tap to enable sound
hero.addEventListener("click", () => {
  if (!soundEnabled) {
    heroVideo.muted = false;
    heroVideo.volume = 1;
    heroVideo.play().catch(()=>{});

    tapSound.style.display = "none";
    volIcon.style.opacity = "1";
    volIcon.style.color = "#00aaff";

    // Spotlight brightens briefly then fades
    spotlight.style.opacity = "1";
    setTimeout(() => {
      spotlight.style.opacity = "0";
    }, 1200);

    soundEnabled = true;
  } else {
    // Tap again = toggle play/pause
    if (heroVideo.paused) heroVideo.play();
    else heroVideo.pause();
  }
});

// Fade spotlight when scrolling
window.addEventListener("scroll", () => {
  if (window.scrollY > 20) {
    spotlight.style.opacity = "0";
  }
});

/* ============================================================
   2. INSTAGRAM-STYLE REELS — AUTO PLAY / PAUSE
   ============================================================ */

const reelVideos = document.querySelectorAll(".reel video");

const reelObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    const v = entry.target;

    if (entry.isIntersecting) {
      v.classList.add("reveal");
      v.play().catch(()=>{});
    } else {
      v.pause();
    }
  });
}, { threshold: 0.6 });

// Observe each reel video
reelVideos.forEach(v => reelObserver.observe(v));

// Tap reel to toggle play/pause AND toggle sound (clean UX)
reelVideos.forEach(v => {
  v.addEventListener("click", () => {
    if (v.paused) v.play();
    else v.pause();

    // If sound OFF → turn ON
    if (v.muted) {
      v.muted = false;
      v.volume = 1;
    } else {
      v.muted = true;
    }
  });
});

/* ============================================================
   3. SCROLL TO GALLERY BUTTON
   ============================================================ */

function scrollToGallery() {
  const g = document.getElementById("gallery");
  g.scrollIntoView({ behavior: "smooth" });
}

/* ============================================================
   4. GALLERY FULLSCREEN VIEWER + SWIPE NAVIGATION
   ============================================================ */

const galleryVideos = document.querySelectorAll(".gallery-grid video");
let fsDiv = null;
let currentIndex = 0;

function openFullscreen(i) {
  currentIndex = i;

  fsDiv = document.createElement("div");
  fsDiv.className = "fullscreen";

  const closeBtn = document.createElement("div");
  closeBtn.className = "close-fs";
  closeBtn.textContent = "×";
  closeBtn.onclick = closeFullscreen;

  const newVid = galleryVideos[i].cloneNode(true);
  newVid.autoplay = true;
  newVid.muted = false;
  newVid.volume = 1;

  fsDiv.appendChild(closeBtn);
  fsDiv.appendChild(newVid);
  document.body.appendChild(fsDiv);

  enableSwipe(fsDiv, newVid);
}

function closeFullscreen() {
  if (fsDiv) fsDiv.remove();
}

// Add click event to open fullscreen
galleryVideos.forEach((v, i) => {
  v.addEventListener("click", () => openFullscreen(i));
});

/* -------------------------
   Swipe navigation (mobile)
   ------------------------- */

function enableSwipe(container, vid) {
  let startY = 0;
  let endY = 0;

  container.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
  });

  container.addEventListener("touchmove", e => {
    endY = e.touches[0].clientY;
  });

  container.addEventListener("touchend", () => {
    const diff = endY - startY;
    if (Math.abs(diff) > 40) {
      if (diff > 0) {
        closeFullscreen(); // swipe down = exit
      } else {
        nextFullscreen(); // swipe up = next
      }
    }
  });
}

function nextFullscreen() {
  const total = galleryVideos.length;
  currentIndex = (currentIndex + 1) % total;
  closeFullscreen();
  openFullscreen(currentIndex);
}

</script>
</body>
</html>
