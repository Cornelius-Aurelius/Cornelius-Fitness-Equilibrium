<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cornelius Aurelius – Fitness Equilibrium</title>

<meta name="theme-color" content="#000000">
<meta name="description" content="Cornelius Aurelius – Fitness Equilibrium. Cinematic reels, fast-loading, tap-to-enable-sound hero, elite masculine minimal design.">

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
 background:#000;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
 overflow-x:hidden;
}

/* NAME */
.namebar{
 width:100%;
 text-align:center;
 margin-top:18px;
 font-size:1.9rem;
 font-weight:bold;
 letter-spacing:3px;
 color:#fff;
}

/* INSTAGRAM BUTTON */
.ig-btn{
 text-align:center;
 margin-top:6px;
}
.ig-btn a{
 color:#00aaff;
 text-decoration:none;
 padding:6px 14px;
 font-size:1.1rem;
 border:1px solid #00aaff55;
 border-radius:8px;
}

/* HERO */
.hero{
 margin-top:20px;
 height:88vh;
 display:flex;
 justify-content:center;
 align-items:center;
 position:relative;
 overflow:hidden;
}

.hero video{
 height:88vh;
 width:auto;
 object-fit:contain;
 border-radius:18px;
 box-shadow:0 0 55px #00aaff44;
 filter:brightness(0.95);
}

/* Spotlight */
.spotlight{
 position:absolute;
 inset:0;
 background:radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 70%);
 pointer-events:none;
 opacity:1;
 transition:1.2s ease;
}

/* Tap to enable sound */
.tap-sound{
 position:absolute;
 bottom:18%;
 background:rgba(0,0,0,0.55);
 padding:8px 20px;
 border-radius:40px;
 font-size:1rem;
 backdrop-filter:blur(6px);
 animation:fadeIn 1.5s ease;
}
@keyframes fadeIn{
 from{opacity:0;} to{opacity:1;}
}

/* Motto */
.motto{
 text-align:center;
 color:#00aaff;
 font-size:1.5rem;
 margin-top:20px;
 letter-spacing:3px;
 font-weight:bold;
 white-space:nowrap;
}

/* Section Title */
.section-title{
 text-align:center;
 color:#00aaff;
 margin-top:40px;
 font-size:1.7rem;
 letter-spacing:1px;
}

/* Reels Feed */
.reels{
 display:flex;
 flex-direction:column;
 gap:35px;
 margin-top:25px;
 padding:0 12px;
}

.reel video{
 width:100%;
 max-height:85vh;
 border-radius:12px;
 background:#000;
 object-fit:contain;
 opacity:0;
 transform:translateY(40px);
 transition:0.7s ease;
}
.reel video.reveal{
 opacity:1;
 transform:translateY(0);
}

/* Gallery Button */
.gallery-btn{
 text-align:center;
 margin-top:-10px;
}
.gallery-btn button{
 background:transparent;
 border:1px solid #00aaff66;
 padding:8px 26px;
 border-radius:30px;
 color:#00aaff;
 font-size:1rem;
 letter-spacing:1px;
}

/* Gallery Grid */
.gallery-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
 gap:14px;
 margin-top:25px;
 padding:0 12px;
}
.gallery-grid video{
 width:100%;
 border-radius:10px;
 background:#000;
 box-shadow:0 0 15px #00aaff22;
}

/* Fullscreen Viewer */
.fullscreen{
 position:fixed;
 inset:0;
 background:#000;
 display:flex;
 justify-content:center;
 align-items:center;
 z-index:9999;
}
.fullscreen video{
 height:100vh;
 width:auto;
 object-fit:contain;
}
.close-fs{
 position:absolute;
 top:20px;
 right:20px;
 font-size:2.5rem;
 color:#fff;
}
footer{
 text-align:center;
 padding:50px 0;
 opacity:0.5;
}
</style>
</head>

<body>

<div class="namebar">CORNELIUS AURELIUS</div>
<div class="ig-btn">
 <a href="https://www.instagram.com/cornelius_aurelius_/" target="_blank">Instagram</a>
</div>

<!-- HERO -->
<section class="hero" id="hero">
 <video id="heroVideo" autoplay muted playsinline>
   <source src="36.mp4" type="video/mp4">
 </video>

 <div class="spotlight" id="spotlight"></div>
 <div class="tap-sound" id="tapSound">Tap to enable sound</div>
</section>

<div class="motto">KEEP • MOVING • FORWARD</div>

<!-- TRAINING VIDEOS TITLE -->
<div class="section-title">Training Videos</div>

<!-- REELS FEED -->
<section class="reels" id="reelsSection">

 <!-- Reels 1–10 -->
 <div class="reel"><video src="1.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="2.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="3.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="4.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="5.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="6.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="7.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="8.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="9.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

 <div class="reel"><video src="10.mp4" playsinline muted></video></div>
 <div class="gallery-btn"><button onclick="scrollToGallery()">VIEW FULL GALLERY</button></div>

</section>

<!-- GALLERY -->
<div class="section-title" id="gallery">Video Gallery</div>

<section class="gallery-grid">

<!-- FULL VIDEO LIST (1–50) -->
<script>
for(let i=1;i<=50;i++){
 document.write(`<video src="${i}.mp4" playsinline muted></video>`);
}
</script>

</section>

<footer>© 2025 Cornelius Aurelius – The Omniscientrix</footer>

<script>
/* HERO SOUND */
const heroVideo=document.getElementById("heroVideo");
const tapSound=document.getElementById("tapSound");
const spotlight=document.getElementById("spotlight");
let soundEnabled=false;

hero.addEventListener("click",()=>{
 if(!soundEnabled){
   heroVideo.muted=false;
   heroVideo.play();
   tapSound.style.display="none";
   spotlight.style.opacity="1";
   setTimeout(()=>spotlight.style.opacity="0",1200);
   soundEnabled=true;
 } else {
   heroVideo.paused?heroVideo.play():heroVideo.pause();
 }
});

/* Spotlight scroll fade */
window.addEventListener("scroll",()=>{
 if(window.scrollY>20){
   spotlight.style.opacity="0";
 }
});

/* REELS AUTO PLAY */
const reelVideos=document.querySelectorAll(".reel video");
const reelObserver=new IntersectionObserver(entries=>{
 entries.forEach(entry=>{
   const v=entry.target;
   if(entry.isIntersecting){
     v.classList.add("reveal");
     v.play().catch(()=>{});
   } else {
     v.pause();
   }
 });
},{threshold:0.6});
reelVideos.forEach(v=>reelObserver.observe(v));

/* Tap to toggle sound + play */
reelVideos.forEach(v=>{
 v.addEventListener("click",()=>{
   v.paused?v.play():v.pause();
   v.muted=!v.muted;
 });
});

/* Scroll to gallery */
function scrollToGallery(){
 document.getElementById("gallery").scrollIntoView({behavior:"smooth"});
}

/* FULLSCREEN VIEWER */
const galleryVideos=document.querySelectorAll(".gallery-grid video");
let fsDiv=null;
let currentIndex=0;

function openFullscreen(i){
 currentIndex=i;
 fsDiv=document.createElement("div");
 fsDiv.className="fullscreen";

 const closeBtn=document.createElement("div");
 closeBtn.className="close-fs";
 closeBtn.textContent="×";
 closeBtn.onclick=closeFullscreen;

 const newVid=galleryVideos[i].cloneNode(true);
 newVid.autoplay=true;
 newVid.muted=false;

 fsDiv.appendChild(closeBtn);
 fsDiv.appendChild(newVid);
 document.body.appendChild(fsDiv);

 enableSwipe(fsDiv,newVid);
}

function closeFullscreen(){ if(fsDiv) fsDiv.remove(); }

/* Click gallery videos */
galleryVideos.forEach((v,i)=>v.addEventListener("click",()=>openFullscreen(i)));

function enableSwipe(container,vid){
 let startY=0,endY=0;
 container.addEventListener("touchstart",e=>startY=e.touches[0].clientY);
 container.addEventListener("touchmove",e=>endY=e.touches[0].clientY);
 container.addEventListener("touchend",()=>{
   const diff=endY-startY;
   if(Math.abs(diff)>40){
     if(diff>0) closeFullscreen();
     else nextFullscreen();
   }
 });
}

function nextFullscreen(){
 currentIndex=(currentIndex+1)%galleryVideos.length;
 closeFullscreen();
 openFullscreen(currentIndex);
}
</script>

</body>
</html>
