<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornelius Aurelius – Physical Equilibrium</title>
    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #fff;
        }

        /* ---------- HERO SECTION ---------- */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            filter: brightness(55%);
        }

        .hero-overlay {
            position: absolute;
            bottom: 20%;
            width: 100%;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            color: #00aaff;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        .cta-btn {
            margin-top: 35px;
            padding: 12px 35px;
            border: 2px solid #00aaff;
            color: #00aaff;
            text-decoration: none;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: 0.3s ease;
        }

        .cta-btn:hover {
            background-color: #00aaff;
            color: #000;
        }

        /* ---------- VIDEO GRID ---------- */
        .section-title {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 20px;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #00aaff;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
            margin-bottom: 40px;
        }

        .video-grid video {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #0f0f0f;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
