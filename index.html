<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cornelius Aurelius – Fitness Equilibrium</title>

<meta name="description" content="Cornelius Aurelius – Fitness Equilibrium. Vertical-reel fitness portal with tiger emblem, neon universe aesthetic, and cinematic mobile-first design.">
<meta name="theme-color" content="#000000">

<style>
/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;}

/* ROOT */
:root{
 --blue:#00aaff;
 --red:#ff3300;
 --glowB:0 0 35px #00aaffaa,0 0 65px #00aaff44;
 --glowR:0 0 35px #ff3300aa,0 0 65px #ff330044;
 --glowTiger:0 0 60px #00aaffaa,0 0 120px #ff330066;
}

/* TOP INSTAGRAM BAR */
.topbar{
 width:100%;
 padding:12px 20px;
 display:flex;
 align-items:center;
 gap:10px;
 background:rgba(0,0,0,0.7);
 backdrop-filter:blur(10px);
 position:fixed;
 top:0;left:0;
 z-index:999;
 border-bottom:1px solid #0a0a0a;
}

.topbar img{
 width:34px;
 height:34px;
 object-fit:contain;
 filter:drop-shadow(0 0 6px #00aaff);
 border-radius:50%;
}

.topbar a{
 color:#00aaff;
 font-size:1.05rem;
 text-decoration:none;
 font-weight:bold;
}

/* HERO */
.hero{
 margin-top:58px;
 position:relative;
 height:100vh;
 width:100%;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
}

/* HERO BACKGROUND GRID */
.hero::before{
 content:"";
 position:absolute;
 inset:0;
 background:
   linear-gradient(90deg,#00223333 1px,transparent 1px),
   linear-gradient(#00223333 1px,transparent 1px);
 background-size:40px 40px;
 opacity:0.07;
 z-index:-3;
 animation:gridMove 40s linear infinite;
}
@keyframes gridMove{
 from{transform:translateY(0);}
 to{transform:translateY(100%);}
}

/* HERO VIDEO (VERTICAL FIT) */
.hero video{
 height:85vh;
 width:auto;
 max-width:80vw;
 border-radius:20px;
 object-fit:contain;
 z-index:2;
 filter:brightness(88%);
 box-shadow:0 0 40px #00aaff55;
}

/* HERO NEON SIDE PANELS */
.hero::after{
 content:"";
 position:absolute;
 left:0;top:0;
 height:100%;width:100%;
 background:linear-gradient(90deg,rgba(0,170,255,0.15),transparent 40%,transparent 60%,rgba(255,50,0,0.15));
 z-index:-2;
}

/* TIGER HOLOGRAM BEHIND HERO */
.tiger-holo{
 position:absolute;
 top:50%;left:50%;
 transform:translate(-50%,-52%) scale(1.25);
 width:420px;
 opacity:0.12;
 z-index:-1;
 filter:drop-shadow(0 0 75px #00aaff);
 animation:tigerFloat 8s ease-in-out infinite;
}
@keyframes tigerFloat{
 0%,100%{transform:translate(-50%,-52%) scale(1.25);}
 50%{transform:translate(-50%,-48%) scale(1.28);}
}

/* HERO TEXT */
.hero-text{
 position:absolute;
 bottom:10%;
 text-align:center;
 animation:fadeUp 2s ease;
}
@keyframes fadeUp{
 from{opacity:0;transform:translateY(40px);}
 to{opacity:1;transform:translateY(0);}
}

.hero-text h1{
 font-size:clamp(2.5rem,7vw,4rem);
 letter-spacing:5px;
 text-transform:uppercase;
 text-shadow:var(--glowB);
}
.hero-text p{
 margin-top:12px;
 opacity:0.85;
 font-size:clamp(1.1rem,3vw,1.4rem);
}

/* CTA */
.cta{
 display:inline-block;
 margin-top:35px;
 padding:14px 46px;
 border-radius:50px;
 border:2px solid #00aaff;
 color:#00aaff;
 text-decoration:none;
 font-size:1.2rem;
 transition:0.3s;
}
.cta:hover{
 background:#00aaff;
 color:#000;
 box-shadow:var(--glowB);
 transform:translateY(-4px);
}

/* SECTION */
.section{
 padding:60px 20px;
 max-width:1500px;
 margin:auto;
}

/* GRID */
.video-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:22px;
 margin-top:40px;
}

.video-grid video{
 width:100%;
 border-radius:14px;
 border:1px solid #0a0a0a;
 background:#000;
 opacity:0;
 transform:translateY(40px);
 transition:0.6s ease;
}

/* Reveal */
video.reveal{
 opacity:1;
 transform:translateY(0);
 box-shadow:0 0 20px #00aaff33;
}

/* TAP TO FULLSCREEN */
.fullscreen{
 position:fixed;
 inset:0;
 background:#000;
 z-index:9999;
 display:flex;
 align-items:center;
 justify-content:center;
}

.fullscreen video{
 width:auto;
 height:100vh;
 object-fit:contain;
}

/* Close zone */
.close-fs{
 position:absolute;
 top:20px;right:20px;
 font-size:2rem;
 color:#fff;
}

/* TIGER WATERMARK BEHIND GRID */
.watermark{
 position:fixed;
 bottom:15%;
 right:-5%;
 opacity:0.06;
 width:500px;
 z-index:-1;
}

/* FOOTER */
footer{
 text-align:center;
 padding:50px;
 opacity:0.55;
 font-size:0.9rem;
 letter-spacing:1px;
}

</style>
</head>

<body>

<!-- TOP INSTAGRAM BAR -->
<div class="topbar">
 <img src="tiger.png">
 <a target="_blank" href="https://www.instagram.com/cornelius_aurelius_/">@cornelius_aurelius_</a>
</div>

<!-- HERO -->
<section class="hero">
 <img src="tiger.png" class="tiger-holo">

 <video autoplay muted loop playsinline>
   <source src="29.mp4" type="video/mp4">
 </video>

 <div class="hero-text">
   <h1>Physical Equilibrium</h1>
   <p>Strength • Aesthetics • Discipline</p>
   <a href="#videos" class="cta">Enter</a>
 </div>
</section>

<!-- TIGER WATERMARK -->
<img src="tiger.png" class="watermark">

<!-- VIDEO SECTION -->
<section id="videos" class="section">
 <h2>Training Videos</h2>

 <div class="video-grid">
 <!-- AUTO-GENERATED 1–50 -->
 <!-- The list below includes all videos 1.mp4 through 50.mp4 -->
 <script>
 let vids="";
 for(let i=1;i<=50;i++){
   vids+=`<video preload="none" muted playsinline controls><source src="${i}.mp4"></video>`;
 }
 document.write(vids);
 </script>
 </div>
</section>

<footer>© 2025 Cornelius Aurelius – The Omniscientrix</footer>

<script>
/* SCROLL REVEAL */
const v=document.querySelectorAll(".video-grid video");
const r=()=>{v.forEach(x=>{
 const t=x.getBoundingClientRect().top;
 if(t<window.innerHeight-80){x.classList.add("reveal");}
});};
window.addEventListener("scroll",r);r();

/* FULLSCREEN REEL MODE */
let fs=null;
v.forEach(video=>{
 video.addEventListener("click",()=>{
   fs=document.createElement("div");
   fs.className="fullscreen";
   fs.innerHTML=`<div class="close-fs">×</div>`;
   let nv=video.cloneNode(true);
   nv.controls=true;
   fs.appendChild(nv);
   document.body.appendChild(fs);

   nv.play();

   fs.querySelector(".close-fs").onclick=()=>fs.remove();
   fs.onclick=e=>{if(e.target===fs)fs.remove();}
 });
});
</script>

</body>
</html>
