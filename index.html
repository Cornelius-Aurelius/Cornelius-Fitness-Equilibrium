    .menu-toggle {

      justify-content:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--glass);
      color:#fff;
      backdrop-filter:blur(16px);
      font-weight:900;
      letter-spacing:.01em;
      cursor:pointer;
      box-shadow:var(--shadow);

    .menu-panel {
      position:absolute;
      top:calc(100% + 10px);
      right:0;
      width:min(300px, calc(100vw - 24px));
      display:none;
      gap:8px;
      padding:10px;
      border-radius:22px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.9);
      backdrop-filter:blur(18px);
      box-shadow:var(--shadow);
    }
    .menu-panel.open { display:grid; }
    .menu-panel a {
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.1);
      background:var(--glass2);

    }
    .menu-panel a:hover,
    .menu-panel a:focus-visible,
    .menu-toggle:hover,
    .menu-toggle:focus-visible {
      outline:0;
      border-color:rgba(11,188,255,.65);
      background:rgba(11,188,255,.12);
    }
    .menu-panel a.tip {
      border-color:rgba(255,209,102,.42);
      background:linear-gradient(135deg, rgba(255,209,102,.18), rgba(11,188,255,.08));
    }

    #feed {
      width:100%;
      min-height:100svh;
    }
    .reel {
      width:100%;
      min-height:100svh;
      height:100svh;
      scroll-snap-align:start;
      scroll-snap-stop:always;
      display:grid;
      place-items:center;
      background:#000;
      padding:0;
      position:relative;
      overflow:hidden;
    }
    .media-shell {
      width:min(100vw, calc(100svh * .5625));
      height:min(100svh, calc(100vw * 1.7777778));
      aspect-ratio:9 / 16;
      display:grid;
      place-items:center;
      background:#000;
      overflow:hidden;
      position:relative;
    }
    .media-shell::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), inset 0 0 90px rgba(0,0,0,.25);
    }
    video,
    img {
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
      display:block;
    }
    video { cursor:pointer; }
    video::-webkit-media-controls-panel { background-image:linear-gradient(transparent, rgba(0,0,0,.45)); }

    .sound-dot {
      position:absolute;
      left:calc(12px + env(safe-area-inset-left));
      bottom:calc(12px + env(safe-area-inset-bottom));
      width:12px;
      height:12px;
      border-radius:999px;
      background:rgba(255,255,255,.45);
      border:1px solid rgba(255,255,255,.22);
      box-shadow:0 0 26px rgba(255,255,255,.22);
      opacity:.8;
      pointer-events:none;
      z-index:5;
    }
    .reel.sound-on .sound-dot {

      overflow:hidden;
      clip:rect(0,0,0,0);

    ];

    const feed = document.getElementById('feed');
    const menuToggle = document.getElementById('menuToggle');
    const menuPanel = document.getElementById('menuPanel');
    const crawlableIndex = document.getElementById('crawlableIndex');
    let activeVideo = null;
    let soundVideo = null;

    function makeUrl(file) {
      return new URL(file, window.location.href).href;
    }

    function createReel(file, index) {
      const section = document.createElement('section');
      section.className = 'reel';
      section.setAttribute('data-index', String(index + 1));
      section.setAttribute('aria-label', `Cornelius Aurelius 9:16 content ${index + 1}`);

      const shell = document.createElement('div');
      shell.className = 'media-shell';

      const video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.muted = true;
      video.loop = true;
      video.preload = index < 2 ? 'metadata' : 'none';
      video.dataset.src = file;
      video.title = `Cornelius Aurelius 9:16 video ${index + 1}`;
      video.setAttribute('aria-label', `Cornelius Aurelius 9:16 video ${index + 1}`);

      const dot = document.createElement('span');
      dot.className = 'sound-dot';
      dot.setAttribute('aria-hidden', 'true');

      video.addEventListener('click', () => {
        if (soundVideo && soundVideo !== video) {
          soundVideo.muted = true;
          soundVideo.closest('.reel')?.classList.remove('sound-on');
        }
        video.muted = !video.muted;
        if (!video.muted) {
          soundVideo = video;
          section.classList.add('sound-on');
          video.play().catch(() => {});
        } else {
          section.classList.remove('sound-on');
        }
      });

      shell.appendChild(video);
      shell.appendChild(dot);
      section.appendChild(shell);
      return section;
    }

    function loadVideo(video) {
      if (!video.dataset.src || video.src) return;
      video.src = video.dataset.src;
      video.load();
    }

    const fragment = document.createDocumentFragment();
    mediaFiles.forEach((file, index) => fragment.appendChild(createReel(file, index)));
    feed.appendChild(fragment);

    crawlableIndex.innerHTML = mediaFiles.map((file, index) =>
      `<a href="${file}">Cornelius Aurelius 9:16 video ${index + 1}</a>`
    ).join(' ');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const reel = entry.target;
        const video = reel.querySelector('video');
        const index = Number(reel.dataset.index || 1) - 1;

        if (entry.isIntersecting) {
          loadVideo(video);
          [index - 1, index + 1].forEach(i => {
            const neighbour = feed.children[i]?.querySelector('video');
            if (neighbour) loadVideo(neighbour);
          });
        }

        if (entry.intersectionRatio >= 0.68) {
          if (activeVideo && activeVideo !== video) activeVideo.pause();
          activeVideo = video;
          loadVideo(video);
          video.play().catch(() => {});
        } else if (entry.intersectionRatio < 0.18 && video !== soundVideo) {
          video.pause();
        }
      });
    }, { threshold:[0.12, 0.18, 0.68], rootMargin:'260px 0px 260px 0px' });

    document.querySelectorAll('.reel').forEach(reel => observer.observe(reel));

    menuToggle.addEventListener('click', () => {
      const open = menuPanel.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', String(open));
    });

    document.addEventListener('click', event => {
      if (!menuPanel.contains(event.target) && !menuToggle.contains(event.target)) {
        menuPanel.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        menuPanel.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }
      if (!activeVideo) return;
      if (event.key === ' ') {
        event.preventDefault();
        activeVideo.paused ? activeVideo.play().catch(() => {}) : activeVideo.pause();
      }
    });

    const rootUrl = window.location.href.split('#')[0];
    const pageUrl = rootUrl.endsWith('/') ? rootUrl : rootUrl.substring(0, rootUrl.lastIndexOf('/') + 1);
    const videoObjects = mediaFiles.map((file, index) => ({
      '@type':'VideoObject',
      name:`Cornelius Aurelius 9:16 Video ${index + 1}`,
      description:'Official 9:16 video content of Cornelius Aurelius.',
      contentUrl: makeUrl(file),
      uploadDate:'2026-05-24',
      width:1080,
      height:1920,
      thumbnailUrl: makeUrl('cornelius-aurelius-video-thumbnail.jpg'),
      creator:{'@type':'Person', name:'Cornelius Aurelius', url:'https://corneliusaurelius.com/'}
    }));

    const schema = {
      '@context':'https://schema.org',
      '@graph':[
        {
          '@type':'Person',
          '@id':'https://corneliusaurelius.com/#person',
          name:'Cornelius Aurelius',
          alternateName:['Cornelious Aurelius','Cornelius Aurielius','Cornelius Aurelias','Cornelius Aureluis'],
          url:'https://corneliusaurelius.com/',
          sameAs:['https://www.instagram.com/cornelius_aurelius_/']
        },
        {
          '@type':'CollectionPage',
          name:'Cornelius Aurelius Content',
          description:'Official fast-loading 9:16 videos and visual content of Cornelius Aurelius.',
          url:rootUrl,
          mainEntity:{'@id':'https://corneliusaurelius.com/#person'},
          hasPart:videoObjects
        },
        {
          '@type':'ItemList',
          name:'Cornelius Aurelius 9:16 Video Index',
          itemListElement:videoObjects.map((item, index) => ({
            '@type':'ListItem',
            position:index + 1,
            item
          }))
        }
      ]
    };

    const schemaScript = document.createElement('script');
    schemaScript.type = 'application/ld+json';
    schemaScript.textContent = JSON.stringify(schema);
    document.head.appendChild(schemaScript);
  </script>
